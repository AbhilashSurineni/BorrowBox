name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: borrowbox_test
          MYSQL_USER: borrowbox
          MYSQL_PASSWORD: borrowbox
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/borrowbox_test
      TEST_DB_USER: borrowbox
      TEST_DB_PASSWORD: borrowbox
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Service containers cannot take server flags; allow trigger creation by the non-SUPER user (docs/DB_NOTES.md).
      - name: Allow trigger creation
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
